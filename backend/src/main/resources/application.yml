spring:
  application:
    name: contract-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:19090}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

contract:
  ai:
    provider: ${CONTRACT_AI_PROVIDER:mock}
    dify-base-url: ${DIFY_BASE_URL:}
    extract-api-key: ${DIFY_API_KEY_EXTRACT:}
    review-api-key: ${DIFY_API_KEY_REVIEW:}
    connect-timeout-seconds: ${DIFY_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${DIFY_READ_TIMEOUT_SECONDS:300}
  auth:
    mode: ${CONTRACT_AUTH_MODE:local}
    iam-base-url: ${IAM_BASE_URL:}
    gateway-base-url: ${IAM_GATEWAY_BASE_URL:}
    client-id: ${IAM_CLIENT_ID:}
    client-secret: ${IAM_CLIENT_SECRET:}
    app-code: ${IAM_APP_CODE:}
    redirect-uri: ${IAM_REDIRECT_URI:http://localhost:19090/api/auth/oidc/callback}
    frontend-url: ${CONTRACT_FRONTEND_URL:http://localhost:5173}
    role-default: ${IAM_ROLE_DEFAULT:VIEWER}
    oidc-authorize-path: ${IAM_OIDC_AUTHORIZE_PATH:/oauth2/authorize}
    oidc-token-path: ${IAM_OIDC_TOKEN_PATH:/oauth2/token}
  document-center:
    provider: ${CONTRACT_FILE_PROVIDER:local}
    gateway-base-url: ${DOCUMENT_CENTER_GATEWAY_BASE_URL:}
    library-id: ${DOCUMENT_CENTER_LIBRARY_ID:}
    app-code: ${DOCUMENT_CENTER_APP_CODE:hr_contract_management}
    service-token: ${DOCUMENT_CENTER_SERVICE_TOKEN:}
